name: Frontend CI/CD Build Check

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/client/**'
      - 'packages/validators/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/client/**'
      - 'packages/validators/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    name: Build & Verify Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm run test --workspace=apps/client

      - name: Build client
        run: npm run build:client
